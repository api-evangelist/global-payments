description: Global Payments (Heartland / TSYS / Global Payments Integrated) does not publish standardized
  per-transaction pricing on its developer-facing portals. Pricing is custom-quoted per merchant and varies
  by industry vertical, processing volume, channel (card-present vs card-not-present), and bundled product
  scope (POS hardware, gateway, payouts). API access is free with a merchant account; cost lives in the
  underlying payment processing rates.
notes: Standard interchange-plus / tiered pricing models apply but specific take-rates are not publicly
  posted. Reconcile only when a published rate card is available.
sources:
  - https://www.globalpayments.com/
  - https://developer.globalpay.com/
plans:
  - id: global-payments-merchant
    name: Merchant Account (Custom)
    type: enterprise
    description: Standard merchant agreement — interchange-plus or tiered pricing negotiated per merchant.
      API access is included with the merchant account.
    entries:
      - label: Per-transaction processing fee
        name: tx_processing
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: custom (interchange-plus or tiered, contact sales)
        userMultiplied: false
      - label: Monthly gateway / platform fee
        name: gateway_fee
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: custom
        userMultiplied: false
    elements:
      - name: Global Payments Unified Payments API
      - name: Global Payments Integrated API
      - name: Card-present and card-not-present processing
      - name: Multi-currency settlement
  - id: global-payments-enterprise
    name: Enterprise / Strategic Partner
    type: enterprise
    description: Custom platform contract for ISVs, marketplaces, and high-volume merchants. Negotiated
      take-rate, dedicated support, and integration assistance.
    entries:
      - label: Negotiated rate
        name: enterprise_rate
        type: metered
        metric: transaction
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: custom
        userMultiplied: false
    elements:
      - name: Volume-tier discounts
      - name: Dedicated technical account management
      - name: Co-branded developer support
      - name: Global Payments Unified Payments API
      - name: Global Payments Integrated API
