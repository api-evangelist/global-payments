naftiko: 1.0.0-alpha2
info:
  label: Global Payments Unified Payments API — Transactions
  description: 'Global Payments Unified Payments API — Transactions. 2 operations. Lead operation: List transactions. Self-contained
    Naftiko capability covering one Global Payments business surface.'
  tags:
  - Global Payments
  - Transactions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    GLOBAL_PAYMENTS_API_KEY: GLOBAL_PAYMENTS_API_KEY
capability:
  consumes:
  - type: http
    namespace: unified-payments-transactions
    baseUri: https://apis.globalpay.com
    description: Global Payments Unified Payments API — Transactions business capability. Self-contained, no shared references.
    resources:
    - name: transactions
      path: /transactions
      operations:
      - name: listtransactions
        method: GET
        description: List transactions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: startDate
          in: query
          type: string
          description: Filter transactions from this date.
        - name: endDate
          in: query
          type: string
          description: Filter transactions up to this date.
        - name: status
          in: query
          type: string
          description: Filter by transaction status.
      - name: createtransaction
        method: POST
        description: Create a transaction
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.GLOBAL_PAYMENTS_API_KEY}}'
  exposes:
  - type: rest
    namespace: unified-payments-transactions-rest
    port: 8080
    description: REST adapter for Global Payments Unified Payments API — Transactions. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/transactions
      name: transactions
      description: REST surface for transactions.
      operations:
      - method: GET
        name: listtransactions
        description: List transactions
        call: unified-payments-transactions.listtransactions
        with:
          startDate: rest.startDate
          endDate: rest.endDate
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createtransaction
        description: Create a transaction
        call: unified-payments-transactions.createtransaction
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: unified-payments-transactions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Global Payments Unified Payments API — Transactions. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-transactions
      description: List transactions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: unified-payments-transactions.listtransactions
      with:
        startDate: tools.startDate
        endDate: tools.endDate
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
    - name: create-transaction
      description: Create a transaction
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: unified-payments-transactions.createtransaction
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
