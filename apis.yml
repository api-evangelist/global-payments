aid: global-payments
name: Global Payments
description: >-
  Global Payments is a leading worldwide provider of payment technology and software solutions delivering innovative
  services to customers globally. The company operates developer portals at developer.globalpayments.com and
  developer.globalpaymentsintegrated.com, offering a unified cloud-powered REST API for payment facilitation, card
  issuing, and multi-currency processing, along with integrated payment solutions for ISVs and software partners.
