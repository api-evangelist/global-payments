specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Global Payments
providerId: global-payments
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Payments
  - Payment Processing
description: 'FOCUS-aligned FinOps framing for Global Payments: take-rate-based payment processing with
  monthly gateway/platform fees. Specific rates are merchant-specific and not publicly posted, so this
  artifact captures meter shape only.'
notes: Reconcile after a public rate card or account-specific contract is referenced.
sources:
  - https://www.globalpayments.com/
  - https://developer.globalpay.com/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Global Payments Inc.
serviceCategory: Payments
billingModel:
  pricingCategory: Take Rate + Subscription
  billingFrequency: Continuous Settlement
  billingCurrency: USD (settlement varies)
  chargeCategories:
    - Usage
    - Purchase
    - Adjustment
    - Refund
    - Credit
focusColumns:
  ServiceName: Global Payments
  ServiceCategory: Payments
  ProviderName: Global Payments
  PublisherName: Global Payments Inc.
  InvoiceIssuerName: Global Payments Inc.
  BillingCurrency: USD
meters:
  - name: card_transactions
    description: Authorized card transactions processed
    unit: transaction
    aggregation: sum
    dimensions:
      - card_brand
      - card_present
      - currency
      - country
  - name: transaction_volume
    description: Total processed volume
    unit: USD
    aggregation: sum
    dimensions:
      - card_brand
      - currency
  - name: chargebacks
    description: Disputed / charged-back transactions
    unit: transaction
    aggregation: sum
  - name: monthly_platform_fee
    description: Gateway / platform recurring fee
    unit: month
    aggregation: sum
  - name: pos_devices
    description: Active card-present POS terminals
    unit: device-month
    aggregation: max
principles:
  - name: Visibility
    description: Use Global Payments merchant statements and reporting APIs to surface daily settlement,
      take-rate, and chargeback exposure.
  - name: Allocation
    description: Tag payments by storefront / channel / business unit via the gateway's metadata fields
      to allocate processing cost.
  - name: Optimization
    description: Negotiate interchange-plus pricing at scale; route low-risk volume to cheaper rails;
      monitor downgrade rates that erode effective take-rate.
  - name: Accountability
    description: Finance reconciles daily settlement files against ledger; merchant operations owns chargeback
      response and rate renegotiation.
maintainers:
  - FN: Kin Lane
    email: info@apievangelist.com
